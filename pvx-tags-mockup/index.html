<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvX Advanced Search</title>
    <style>
        :root {
            --bg-color: var(--theme-page-background-color, #ffffff);
            --panel-bg: var(--theme-page-background-color, #fbfbfb);
            --text-main: var(--theme-text-color, #3a3a3a);
            --text-muted: var(--theme-page-text-color, #757575);
            --border-color: var(--theme-border-color, #cccccc);
            --accent: var(--theme-link-color, #0645ad);
            --accent-hover: var(--theme-link-color--hover, #0b0080);
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .sidebar-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text-main);
        }
        
        .reset-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            transition: 0.2s;
        }
        .reset-btn:hover { background: var(--border-color); color: var(--accent-hover); }
        
        .group-reset-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            padding: 2px 6px;
            transition: 0.2s;
        }
        .group-reset-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }
        
        .filter-group {
            margin-bottom: 10px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .filter-group summary {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .filter-group summary::-webkit-details-marker { display: none; }
        .filter-group summary::after { content: '+'; font-size: 16px; color: var(--accent); }
        .filter-group[open] summary::after { content: '−'; }
        
        .filter-content {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }
        .filter-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--border-color);
        }
        .any-toggle-container {
            font-weight: bold;
            color: var(--accent);
            margin: 0;
        }
        
        .checkbox-label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            cursor: pointer;
        }
        .specifics { transition: opacity 0.2s, filter 0.2s; }
        .disabled-label {
            opacity: 0.3;
            filter: grayscale(100%);
        }
        .disabled-label input[type="text"] {
            background-color: #e9e9e9;
        }
        
        .main-content { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
            background-color: var(--bg-color);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background-color: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .controls select, .controls input {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 3px;
            font-size: 13px;
        }
        .group-header {
            font-size: 15px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            grid-column: 1 / -1; /* Ensure header spans full width of grid */
        }
        
        /* Grid container for streamlined results */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px;
        }

        .build-item {
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .build-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .build-title { 
            font-weight: bold; 
            flex-grow: 1; 
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .build-title a {
            color: var(--accent);
            text-decoration: none;
        }
        .build-title a:hover {
            text-decoration: underline;
        }
        
        .tag {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            color: #000;
            min-width: 65px;
            text-align: center;
            flex-shrink: 0;
        }
        .tag-recommended { background-color: #ce93d8; } 
        .tag-great { background-color: #4CAF50; color: white; }
        .tag-good { background-color: #FFEB3B; }
        .tag-creative { background-color: #FF9800; color: white; }
        .tag-testing { background-color: #03A9F4; color: white; }
        .tag-trial { background-color: #9E9E9E; color: white; }
        .meta-tags { 
            font-size: 11px; 
            color: var(--text-muted); 
            text-align: left; 
        }
    </style>
</head>

    { title: "Build:Team - Urgoz Warriorway", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "12", usage: "Speedclear", location: ["Urgoz's Warren"], drops: [] },
    { title: "Build:Team - UW 600 Duo", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "2", usage: "Farming", location: ["The Underworld"], drops: [] },
    { title: "Build:Team - UW Advanced Terraway", tier: "Recommended", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "Speedclear", location: ["The Underworld"], drops: [] },
    { title: "Build:Team - UW Triple Melee", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "General", location: ["The Underworld"], drops: [] },
    { title: "Build:Team - Voltaic Spear Farm", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "2", usage: "Farming", location: ["General"], drops: [] },
    { title: "Build:Team - DoA 5 Man", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "5", usage: "Speedclear", location: ["Domain of Anguish"], drops: [] },
    { title: "Build:Team - DoA Conta", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "Speedclear", location: ["Domain of Anguish"], drops: [] },
    { title: "Build:Team - MQSC Luxon FFF", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "Farming", location: ["General"], drops: [] },
    { title: "Build:Team - MTSC Dervway Kurzick FFF", tier: "Recommended", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "Farming", location: ["General"], drops: [] },
    { title: "Build:Team - The Deep 5 Man Manly Spike", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "12", usage: "Speedclear", location: ["The Deep"], drops: [] },
    { title: "Build:Team - Urgoz Slingway", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "12", usage: "Speedclear", location: ["Urgoz's Warren"], drops: [] },
    { title: "Build:Team - UW Glaiveway", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "Speedclear", location: ["The Underworld"], drops: [] },
    { title: "Build:Team - UW UBway", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "Speedclear", location: ["The Underworld"], drops: [] },
    { title: "Build:Team - ZB Any Profession Raven Rush", tier: "Great", mode: "PvE", primary: "Any", secondary: "Any", target: "Player", structure: "Team", team_size: "8", usage: "General", location: ["General"], drops: [] }
        ];

        const tierRanks = { "Recommended": 1, "Great": 2, "Good": 3, "Creative": 4, "Testing": 5, "Trial": 6 };

        pvxData.forEach(build => {
            let inheritedDrops = [];
            build.location.forEach(loc => {
                if (locationDrops[loc]) inheritedDrops.push(...locationDrops[loc]);
            });
            build.allDrops = [...new Set([...inheritedDrops, ...build.drops])];
        });

        // Event Listeners for "[Any]" checkboxes
        document.querySelectorAll('.any-toggle').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                const group = e.target.closest('.filter-group');
                const specificsDiv = group.querySelector('.specifics');
                if (e.target.checked) {
                    specificsDiv.classList.add('disabled-label');
                } else {
                    specificsDiv.classList.remove('disabled-label');
                }
                renderResults();
            });
        });

        // Event Listeners for individual "Reset" buttons inside menus
        document.querySelectorAll('.group-reset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault(); 
                const group = e.target.closest('.filter-group');
                
                const anyToggle = group.querySelector('.any-toggle');
                anyToggle.checked = true;
                group.querySelector('.specifics').classList.add('disabled-label');
                
                group.querySelectorAll('.specifics input[type="checkbox"]').forEach(cb => cb.checked = false);
                const textInput = group.querySelector('input[type="text"]');
                if (textInput) textInput.value = "";
                
                renderResults();
            });
        });

        // Listener for specific checkboxes to dynamically toggle [Any] state
        document.querySelectorAll('.specifics input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const group = e.target.closest('.filter-group');
                const anyToggle = group.querySelector('.any-toggle');
                const specificsDiv = group.querySelector('.specifics');

                if (anyToggle && anyToggle.checked) {
                    anyToggle.checked = false;
                    specificsDiv.classList.remove('disabled-label');
                }

                const anyCheckedInGroup = Array.from(group.querySelectorAll('.specifics input[type="checkbox"]')).some(input => input.checked);
                if (!anyCheckedInGroup) {
                    anyToggle.checked = true;
                    specificsDiv.classList.add('disabled-label');
                }

                renderResults();
            });
        });

        // Listener for Team Size text input to dynamically toggle [Any] state
        document.getElementById('teamSizeInput').addEventListener('input', (e) => {
            const group = e.target.closest('.filter-group');
            const anyToggle = group.querySelector('.any-toggle');
            const specificsDiv = group.querySelector('.specifics');

            if (anyToggle && anyToggle.checked && e.target.value.trim() !== "") {
                anyToggle.checked = false;
                specificsDiv.classList.remove('disabled-label');
            } else if (e.target.value.trim() === "") {
                anyToggle.checked = true;
                specificsDiv.classList.add('disabled-label');
            }

            renderResults();
        });

        document.getElementById('textSearch').addEventListener('input', renderResults);
        document.getElementById('groupBy').addEventListener('change', renderResults);
        document.getElementById('sortBy').addEventListener('change', renderResults);

        document.getElementById('globalReset').addEventListener('click', () => {
            document.querySelectorAll('.any-toggle').forEach(cb => cb.checked = true);
            document.querySelectorAll('.specifics').forEach(div => div.classList.add('disabled-label'));
            document.querySelectorAll('.specifics input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('teamSizeInput').value = "";
            document.getElementById('textSearch').value = "";
            
            window.history.replaceState({}, document.title, window.location.pathname);
            renderResults();
        });

        function initializeFilters() {
            document.querySelectorAll('.filter-group').forEach(group => {
                const anyToggle = group.querySelector('.any-toggle');
                if (anyToggle) {
                    anyToggle.checked = true;
                    group.querySelector('.specifics').classList.add('disabled-label');
                    group.querySelectorAll('.specifics input[type="checkbox"]').forEach(cb => cb.checked = false);
                }
            });
            const teamInput = document.getElementById('teamSizeInput');
            if (teamInput) teamInput.value = "";
        }

        function applyUrlParams() {
            const params = new URLSearchParams(window.location.search);
            
            params.forEach((value, key) => {
                const group = document.querySelector(`.filter-group[data-category="${key}"]`);
                if (group) {
                    group.open = true; 
                    
                    const anyToggle = group.querySelector('.any-toggle');
                    if (anyToggle) {
                        anyToggle.checked = false;
                        group.querySelector('.specifics').classList.remove('disabled-label');
                    }

                    if (key === 'team_size') {
                        document.getElementById('teamSizeInput').value = value;
                    } else {
                        const targetValues = value.split(',').map(v => v.trim().toLowerCase());
                        group.querySelectorAll('.specifics input[type="checkbox"]').forEach(cb => {
                            const cbValues = cb.value.toLowerCase().split(',');
                            if (cbValues.some(v => targetValues.includes(v))) {
                                cb.checked = true;
                            }
                        });
                    }
                }
            });
        }

        function getActiveFilters() {
            const filters = {};
            document.querySelectorAll('.filter-group').forEach(group => {
                const category = group.dataset.category;
                const isAnyChecked = group.querySelector('.any-toggle').checked;
                
                if (isAnyChecked) {
                    filters[category] = "ANY";
                } else if (category === 'team_size') {
                    const val = document.getElementById('teamSizeInput').value;
                    filters[category] = val ? val.split(',').map(s => s.trim()) : [];
                } else {
                    let vals = [];
                    group.querySelectorAll('.specifics input:checked').forEach(cb => {
                        vals.push(...cb.value.split(','));
                    });
                    filters[category] = vals;
                }
            });
            return filters;
        }

        function filterData() {
            const filters = getActiveFilters();
            const searchTerm = document.getElementById('textSearch').value.toLowerCase();

            return pvxData.filter(build => {
                if (searchTerm && !build.title.toLowerCase().includes(searchTerm)) return false;

                for (const [category, activeValues] of Object.entries(filters)) {
                    if (activeValues === "ANY" || activeValues.length === 0) continue; 

                    let buildValue = build[category];
                    if (category === 'drops') buildValue = build.allDrops;

                    if (Array.isArray(buildValue)) {
                        const hasIntersection = buildValue.some(val => activeValues.includes(val));
                        if (!hasIntersection) return false;
                    } else {
                        if ((category === 'primary' || category === 'secondary') && buildValue === 'Any') continue;
                        if (!activeValues.includes(buildValue)) return false;
                    }
                }
                return true;
            });
        }

        function renderResults() {
            const filtered = filterData();
            const groupBy = document.getElementById('groupBy').value;
            const sortBy = document.getElementById('sortBy').value;
            const container = document.getElementById('resultsContainer');
            container.innerHTML = "";

            filtered.sort((a, b) => {
                if (sortBy === 'alpha') return a.title.localeCompare(b.title);
                if (sortBy === 'tier') {
                    const tierDiff = tierRanks[a.tier] - tierRanks[b.tier];
                    if (tierDiff !== 0) return tierDiff;
                    return a.title.localeCompare(b.title); 
                }
            });

            let grouped = { "All Builds": filtered };
            if (groupBy !== 'none') {
                grouped = {};
                filtered.forEach(build => {
                    let groupKey = build[groupBy] || "Uncategorized";
                    if (Array.isArray(groupKey)) groupKey = groupKey.join(", ");
                    if (!grouped[groupKey]) grouped[groupKey] = [];
                    grouped[groupKey].push(build);
                });
            }

            let sortedGroupKeys = Object.keys(grouped);
            if (groupBy === 'primary') {
                sortedGroupKeys.sort((a, b) => {
                    if (a === 'Any') return -1;
                    if (b === 'Any') return 1;
                    return a.localeCompare(b);
                });
            } else if (groupBy === 'tier') {
                sortedGroupKeys.sort((a, b) => (tierRanks[a] || 99) - (tierRanks[b] || 99));
            } else if (groupBy !== 'none') {
                sortedGroupKeys.sort((a, b) => a.localeCompare(b));
            }

            // Create Grid per group to keep headers isolated from columns
            for (const groupName of sortedGroupKeys) {
                const builds = grouped[groupName];
                if (builds.length === 0) continue;
                
                if (groupBy !== 'none') {
                    const header = document.createElement('div');
                    header.className = 'group-header';
                    header.innerText = groupName;
                    container.appendChild(header);
                }

                const gridWrapper = document.createElement('div');
                gridWrapper.className = 'results-grid';
                container.appendChild(gridWrapper);

                builds.forEach(build => {
                    const item = document.createElement('div');
                    item.className = 'build-item';
                    const tierClass = `tag-${build.tier.toLowerCase()}`;
                    
                    let secondaryStr = build.secondary === "Any" ? "*" : build.secondary;
                    let profString = `${build.primary}/${secondaryStr} | `;
                    
                    if (build.structure === "Team" && build.target !== "Hero") {
                        profString = "";
                    }

                    let sizeStr = (build.structure === "Team" || build.structure === "Solo") ? ` | Size: ${build.team_size}` : "";
                    
                    // Generate proper Fandom URL from original title, but strip "Build:" for visual display
                    let buildUrl = `https://gwpvx.fandom.com/wiki/${encodeURIComponent(build.title.replace(/ /g, '_'))}`;
                    let visualTitle = build.title.startsWith("Build:") ? build.title.substring(6) : build.title;
                    
                    item.innerHTML = `
                        <div class="build-item-header">
                            <div class="tag ${tierClass}">${build.tier}</div>
                            <div class="build-title"><a href="${buildUrl}" target="_blank" title="${visualTitle}">${visualTitle}</a></div>
                        </div>
                        <div class="meta-tags">
                            ${build.mode} | ${profString}${build.target} | ${build.usage} ${sizeStr}
                        </div>
                    `;
                    gridWrapper.appendChild(item);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = "<p style='color: var(--text-muted);'>No builds match your exact filters.</p>";
            }
        }

        initializeFilters();
        applyUrlParams();
        renderResults();
    </script>
</body>
</html>
